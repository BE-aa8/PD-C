name: CI

# Runs on every push and pull request (same structure as the separations repo):
#   1. Python reference (ap-sim/apsim) and its own tests: the independent reference that
#      generates the expected values both website builds are graded against
#   2. npm test: grades every build's site/**/js/model.js against tests/expected.json
#      (skipped until the shared tests exist; they are written before either site build)
#   3. browser smoke test of site/ and site/gemini/ (skipped until a site exists)
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to test (blank = the branch this run was started on). Used to test gemini/pro, whose pushes come from a workflow and so don't trigger CI automatically."
        type: string
        required: false

permissions:
  contents: read

jobs:
  reference:
    name: Python reference + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # the version the reference was verified on
      - name: Install
        run: pip install -r ap-sim/requirements.txt
      - name: pytest (ap-sim)
        working-directory: ap-sim
        run: python -m pytest -q
      - name: data.js is generated from the reference (no hand edits)
        run: python3 tools/build_data.py --check
      - name: expected.json is generated from the reference (no hand edits)
        run: python3 tools/build_expected.py --check

  test:
    name: Model tests (npm test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Skip if the shared tests don't exist yet
        id: has_tests
        run: |
          if ls tests/*.test.mjs >/dev/null 2>&1; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "No tests/*.test.mjs yet, skipping."; fi
      - name: npm test
        if: steps.has_tests.outputs.run == 'true'
        run: npm test

  browser:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Skip if no site has been built yet; test only the builds that exist
        id: has_site
        run: |
          P=""
          [ -f site/index.html ] && P="/"
          [ -f site/gemini/index.html ] && P="${P:+$P,}/gemini/"
          if [ -n "$P" ] && [ -f tests/browser-smoke.mjs ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "paths=$P" >> "$GITHUB_OUTPUT"; echo "Testing: $P"; else echo "No site or smoke test yet, skipping."; fi
      - name: Install Playwright + Chromium
        if: steps.has_site.outputs.run == 'true'
        run: |
          npm install --no-save playwright@1.65.0
          npx playwright install --with-deps chromium
      - name: Serve site/ and run the smoke test (light + dark)
        if: steps.has_site.outputs.run == 'true'
        run: |
          python3 -m http.server 8000 -d site >/dev/null 2>&1 &
          sleep 2
          node tests/browser-smoke.mjs --base http://localhost:8000 --paths ${{ steps.has_site.outputs.paths }} --out smoke-results
          node tests/browser-smoke.mjs --base http://localhost:8000 --paths ${{ steps.has_site.outputs.paths }} --out smoke-results/dark --scheme dark
      - name: Job summary
        if: always() && steps.has_site.outputs.run == 'true'
        run: '[ -f smoke-results/report.md ] && cat smoke-results/report.md smoke-results/dark/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true'
      - name: Upload screenshots and report
        if: always() && steps.has_site.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-results/
          retention-days: 30

  # 4. Publish site/ (both builds) to GitHub Pages, only from main and only after all checks pass.
  #    One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
  deploy:
    name: Deploy site/ to GitHub Pages
    needs: [reference, test, browser]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.ref == ''))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  # 5. Test the live site (replaces "deployed, run the tests on the live site"): the deployed files must match
  #    the repo byte for byte, and the smoke test must pass on both builds in light and dark, with the real CDNs.
  live:
    name: Live-site tests (GitHub Pages)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deployed files match the repo byte for byte
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          BASE="${PAGE_URL%/}"
          echo "Live URL: $BASE/"
          for attempt in 1 2 3 4 5 6; do
            bad=0
            while IFS= read -r f; do
              rel="${f#site/}"
              if ! curl -fsSL -H 'Cache-Control: no-cache' "$BASE/$rel?nocache=$GITHUB_RUN_ID-$attempt" -o /tmp/live_file || ! cmp -s "$f" /tmp/live_file; then
                echo "mismatch or missing: $rel"; bad=1
              fi
            done < <(find site -type f | sort)
            [ "$bad" = 0 ] && { echo "All $(find site -type f | wc -l) files match."; exit 0; }
            echo "Attempt $attempt failed; waiting for the CDN to update"; sleep 15
          done
          exit 1
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright@1.65.0
          npx playwright install --with-deps chromium
      - name: Smoke test on the live site (light + dark, both builds)
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          BASE="${PAGE_URL%/}"
          node tests/browser-smoke.mjs --base "$BASE" --paths /,/gemini/ --out live-results
          node tests/browser-smoke.mjs --base "$BASE" --paths /,/gemini/ --out live-results/dark --scheme dark
      - name: Job summary
        if: always()
        run: |
          { echo "Live site: ${{ needs.deploy.outputs.page_url }}"; echo; cat live-results/report.md live-results/dark/report.md; } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-results
          path: live-results/
          retention-days: 30
